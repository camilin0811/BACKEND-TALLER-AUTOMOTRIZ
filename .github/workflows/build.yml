name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar y probar
        run: mvn -B verify

      # La cobertura minima del dominio la exige JaCoCo dentro de `verify`:
      # si baja del 90 % el build falla aqui, no en revision de codigo.
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/

  imagen:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4

      # Construir la imagen en CI es la unica verificacion real de que el
      # Dockerfile funciona. Revisarlo a ojo no prueba nada.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: taller-backend:ci

      - name: Comprobar que el jar arranca dentro de la imagen
        run: |
          # Se ejecuta en primer plano y se captura la salida: la aplicacion
          # termina sola al no encontrar MongoDB, y con --rm el contenedor
          # desaparece antes de poder leerle los registros.
          timeout 150 docker run --name prueba             -e JWT_SECRETO=secreto-de-prueba-con-mas-de-32-caracteres             -e MONGODB_URI=mongodb://no-existe:27017/taller             taller-backend:ci > salida.txt 2>&1 || true
          docker rm -f prueba > /dev/null 2>&1 || true
          echo "----- ultimas lineas -----"; tail -15 salida.txt
          # Que arranque Spring y falle por conexion es exactamente lo
          # esperado: prueba que la imagen empaqueta y ejecuta el jar.
          if grep -qE "MongoTimeoutException|Started TallerApplication|APPLICATION FAILED TO START" salida.txt; then
            echo "OK: la imagen ejecuta la aplicacion"
          else
            echo "FALLO: la imagen no llego a ejecutar la aplicacion"; exit 1
          fi
