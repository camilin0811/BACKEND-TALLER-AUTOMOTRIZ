spring:
  application:
    name: taller-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/taller}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

taller:
  cors:
    # Origenes del frontend. En produccion se sobrescribe por variable de entorno.
    origenes: ${CORS_ORIGENES:http://localhost:5173,http://localhost:4173}
  facturacion:
    iva: 0.19
    proveedor-url: ${DIAN_PROVEEDOR_URL:http://localhost:9090/dian}
    api-key: ${DIAN_API_KEY:}
    reintentos: 3
  mensajeria:
    whatsapp-url: ${WHATSAPP_URL:http://localhost:9091/whatsapp}
    token: ${WHATSAPP_TOKEN:}
    secreto-webhook: ${WHATSAPP_WEBHOOK_SECRET:}
  mantenimiento:
    automovil:
      kilometros: 5000
      meses: 6
    motocicleta:
      kilometros: 3000
      meses: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /api-docs

logging:
  level:
    com.taller: INFO
