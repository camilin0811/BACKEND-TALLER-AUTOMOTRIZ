spring:
  application:
    name: taller-backend
  main:
    # Los beans se crean cuando alguien los usa, no todos al arrancar: en el
    # plan gratuito de Render el servicio despierta de cero en cada visita y
    # cada segundo de arranque lo espera un usuario.
    lazy-initialization: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/taller}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

taller:
  seguridad:
    jwt:
      # Obligatorio. En produccion se inyecta por variable de entorno; el valor
      # de desarrollo nunca debe usarse fuera de la maquina local.
      secreto: ${JWT_SECRETO:desarrollo-local-cambiar-en-produccion-32+}
      duracion-segundos: ${JWT_DURACION:28800}
      emisor: taller-backend
  cors:
    # Origenes del frontend. En produccion se sobrescribe por variable de entorno.
    origenes: ${CORS_ORIGENES:http://localhost:5173,http://localhost:4173}
  facturacion:
    iva: 0.19
    # Sin proveedor tecnologico contratado la facturacion se simula: el ciclo
    # se recorre completo y el CUFE generado NO tiene validez fiscal.
    # Para usar el proveedor real: poner false y completar url y api-key.
    simulada: ${DIAN_SIMULADA:true}
    proveedor-url: ${DIAN_PROVEEDOR_URL:http://localhost:9090/dian}
    api-key: ${DIAN_API_KEY:}
    reintentos: 3
  mensajeria:
    whatsapp-url: ${WHATSAPP_URL:http://localhost:9091/whatsapp}
    token: ${WHATSAPP_TOKEN:}
    secreto-webhook: ${WHATSAPP_WEBHOOK_SECRET:}
  mantenimiento:
    automovil:
      kilometros: 5000
      meses: 6
    motocicleta:
      kilometros: 3000
      meses: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /api-docs

logging:
  level:
    com.taller: INFO
